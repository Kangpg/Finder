</style></head><body><main><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="finder-search-algorithm-title finder-search-algorithm-desc"><title id="finder-search-algorithm-title">작게 추리고, 정확하게 찾기</title><desc id="finder-search-algorithm-desc">검색어 파싱, Unicode 3글자 역색인 후보 선택, 변경분 병합, 정확 검사와 상위 결과 정렬 흐름입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#52779f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="1200" fill="#f8fafc"/><text x="48" y="48" class="eyebrow" >02  /  SEARCH ALGORITHM</text><text x="48" y="108" class="headline" >작게 추리고, 정확하게 찾기</text><text x="48" y="148" class="subtitle" >파일명은 역색인으로 후보를 줄이고, 경로와 검색 조건은 마지막에 정확하게 검사합니다.</text><text x="1552" y="48" class="small" text-anchor="end">Kangpg  /  Finder 0.1.0</text><rect x="48" y="184" width="1504" height="100" rx="8" fill="#172b48"/><text x="72" y="218" class="eyebrow inverse" >SEARCH EXAMPLE</text><text x="72" y="260" class="qcode" >serverconfig.xml \global_tru</text><text x="1528" y="244" class="white" text-anchor="end" style="font-size:20px">파일명 AND 경로</text><path d="M 496 456 L 576 456" class="line"/><path d="M 1024 456 L 1104 456" class="line"/><path d="M 1328 544 L 1328 728" class="line"/><path d="M 1104 816 L 1024 816" class="line"/><path d="M 576 816 L 496 816" class="line"/><path d="M 800 544 L 800 632 Q 800 640 808 640 L 1072 640 Q 1080 640 1080 648 L 1080 776 Q 1080 784 1088 784 L 1104 784" class="line secondary"/><rect x="836" y="623" width="192" height="26" fill="#f8fafc"/><text x="844" y="640" class="line-label" >축소 불가 → 전체 ID</text><rect x="1332" y="615" width="84" height="26" fill="#f8fafc"/><text x="1340" y="632" class="line-label" >후보 ID</text><rect x="48" y="368" width="448" height="176" rx="8" class="node"/><text x="72" y="408" class="node-title" >01  질의 파싱</text><text x="72" y="444" class="body" >공백 = AND / | = OR / ! = NOT</text><text x="72" y="472" class="body" >파일명과 \경로 조건을 분리</text><text x="72" y="500" class="body" >그룹·종류·확장자 조건을 AST로</text><text x="72" y="524" class="code" >query.rs</text><rect x="576" y="368" width="448" height="176" rx="8" class="focus"/><text x="600" y="408" class="node-title" >02  역색인에서 후보 선택</text><text x="600" y="444" class="body" >파일명 → Unicode 3글자 해시</text><text x="600" y="472" class="body" >필수 gram 중 가장 작은 posting 사용</text><text x="600" y="500" class="body" >AND는 가장 작은 안전한 후보 선택</text><text x="600" y="524" class="code" >trigram.rs</text><rect x="1104" y="368" width="448" height="176" rx="8" class="node"/><text x="1128" y="408" class="node-title" >03  최신 변경분 반영</text><text x="1128" y="444" class="body" >기본 후보 ∪ 생성·변경된 ID</text><text x="1128" y="472" class="body" >삭제된 레코드는 생존 여부로 제외</text><text x="1128" y="500" class="body" >여러 OR 분기는 안전할 때만 합집합</text><text x="1128" y="524" class="code" >trigram.rs / index.rs</text><rect x="1104" y="728" width="448" height="176" rx="8" class="focus"/><text x="1128" y="768" class="node-title" >04  원래 검색식으로 검사</text><text x="1128" y="804" class="body" >파일명 + 경로 + 모든 필터를 확인</text><text x="1128" y="832" class="body" >일반 문자열은 memchr 부분문자열 검색</text><text x="1128" y="860" class="body" >해시 충돌 후보도 여기서 걸러냅니다.</text><text x="1128" y="884" class="code" >Query::matches</text><rect x="576" y="728" width="448" height="176" rx="8" class="node"/><text x="600" y="768" class="node-title" >05  상위 결과만 정렬</text><text x="600" y="804" class="body" >희소 이름 후보: 병렬 검사 → top-K</text><text x="600" y="832" class="body" >select_nth 후 K개 정렬 / 기타 힙 사용</text><text x="600" y="860" class="body" >준비된 이름·위치 순서도 재사용</text><text x="600" y="884" class="code" >index.rs / ordering.rs</text><rect x="48" y="728" width="448" height="176" rx="8" class="node"/><text x="72" y="768" class="node-title" >06  화면에 결과 게시</text><text x="72" y="804" class="body" >전체 일치 수 + 최대 5,000개 표시</text><text x="72" y="832" class="body" >새 질의가 오면 이전 결과 게시 차단</text><text x="72" y="860" class="body" >가상 스크롤 + 보이는 행만 속성 조회</text><text x="72" y="884" class="code" >background.rs / search_pane.rs</text><line x1="48" y1="952" x2="1552" y2="952" class="rule"/><text x="48" y="1000" class="foot-title" >필요할 때 전체 검색</text><text x="48" y="1038" class="body" >짧은 검색어·정규식·경로 단독 등은</text><text x="48" y="1066" class="body" >안전한 후보를 못 구하면 전체를 검사합니다.</text><text x="576" y="1000" class="foot-title" >갱신은 증분으로</text><text x="576" y="1038" class="body" >USN 변경 ID를 후보에 함께 넣고</text><text x="576" y="1066" class="body" >누적 기준을 넘으면 역색인을 재구성합니다.</text><text x="1104" y="1000" class="foot-title" >정확성은 원래 검색식에</text><text x="1104" y="1038" class="body" >역색인은 후보를 고르는 가속 자료입니다.</text><text x="1104" y="1066" class="body" >최종 검색식 검사가 일치 여부를 결정합니다.</text><text x="48" y="1132" class="small" >성능 수치를 뜻하는 그림이 아닙니다. 후보 수·색인 모드·정렬 조건·Shell 확장에 따라 작업량이 달라집니다.</text><text x="1552" y="1168" class="code" text-anchor="end">02 / 02</text></svg></div><footer>실제 Rust 소스 기준 · 2026-10-29 · 파일명·경로 검색 · 정적 구성도 · <a href="README.md">구조 설명 및 코드 근거</a></footer></main></body></html>
